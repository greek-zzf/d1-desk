<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-1-split-console.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Petrona:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#171820}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1376px">
  <div class="r-brand-title region text" data-region="brand-title"><!-- D1 Desk italic serif title --><p style="font-size:var(--r-brand-title-font);font-family:var(--r-brand-title-family),sans-serif;font-weight:var(--r-brand-title-weight);line-height:1.05;margin:0">brand-title</p></div>
  <div class="r-brand-badge region control" data-region="brand-badge"><!-- LEDGER // v2.4 badge: rebuild the control's chrome from the crop (comp-spec.mjs --crop brand-badge); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-topology-flow region chrome" data-region="topology-flow"><!-- Architecture topology dataflow diagram --></div>
  <div class="r-security-heading region text" data-region="security-heading"><!-- Zero-disk security guarantees heading --><p style="font-size:var(--r-security-heading-font);line-height:1.05;margin:0">security-heading</p></div>
  <div class="r-security-bullets region text" data-region="security-bullets"><!-- Zero-disk bullet points list --><p style="font-size:var(--r-security-bullets-font);line-height:1.05;margin:0">security-bullets</p></div>
  <div class="r-terminal-chrome region chrome" data-region="terminal-chrome"><!-- Terminal window title bar with traffic lights --></div>
  <div class="r-token-label region text" data-region="token-label"><!-- API token field label --><p style="font-size:var(--r-token-label-font);line-height:1.05;margin:0">token-label</p></div>
  <div class="r-token-input region control" data-region="token-input"><!-- API token password input box: rebuild the control's chrome from the crop (comp-spec.mjs --crop token-input); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-permission-scopes region control" data-region="permission-scopes"><!-- Permission scope pills row: rebuild the control's chrome from the crop (comp-spec.mjs --crop permission-scopes); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-submit-button region control" data-region="submit-button"><!-- VALIDATE & ENTER WORKSPACE button: rebuild the control's chrome from the crop (comp-spec.mjs --crop submit-button); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
